en:
  site_settings:
    discourse_user_cosmetics_enabled: "Enable the User Cosmetics plugin (avatar frames, nameplates, and user card decorations)."
    discourse_user_cosmetics_avatar_frames_enabled: "Allow members to equip avatar frames."
    discourse_user_cosmetics_nameplates_enabled: "Allow members to equip nameplates."
    discourse_user_cosmetics_card_decorations_enabled: "Allow members to equip user card decorations."
    discourse_user_cosmetics_profile_effects_enabled: "Allow members to equip profile effects (Discord-style layered frames around the user card)."
    discourse_user_cosmetics_frame_overhang_percent: "How far an avatar frame extends past the edge of the avatar, as a percentage of the avatar's size."
    discourse_user_cosmetics_max_image_kb: "Optional extra cosmetic image limit in KB. Use 0 to inherit Discourse's max_image_size_kb setting."

  discourse_user_cosmetics:
    title: "User Cosmetics"
    errors:
      upload_missing: "references an upload that no longer exists"
      unsupported_image_format: "must use PNG, JPG, JPEG, GIF, or WEBP"
      image_too_large: "must be %{max_kb} KB or smaller"
      invalid_image_url: "must be a safe plugin/upload path or a valid HTTPS URL"

  activerecord:
    errors:
      models:
        discourse_user_cosmetics/item:
          attributes:
            gradient_from:
              invalid: "must be a hex color, e.g. #FF9900"
            gradient_to:
              invalid: "must be a hex color, e.g. #FF9900"
            glow_color:
              invalid: "must be a hex color, e.g. #FF9900"
            rarity_color:
              invalid: "must be a hex color, e.g. #FF9900"
            slug:
              taken: "is already used by another item of the same kind"
