name: Critical Integrity Runtime Test

on:
  push:
    branches:
      - fix/critical-integrity-hardening
      - fix/profile-effect-layer-validation
      - fix/cosmetics-stylesheet-cache-invalidation
      - fix/user-catalog-active-entitlement
      - fix/deleted-group-item-group-cleanup
      - fix/deleted-user-cosmetic-reference-cleanup
      - fix/private-stylesheet-access
      - fix/username-stylesheet-invalidation
      - perf/bulk-cosmetics-css-entitlements
      - perf/target-user-selection-cache
      - perf/target-direct-grant-cache
      - perf/bulk-mine-entitlements
      - perf/bulk-presenter-entitlements
      - perf/admin-catalog-serialization
      - perf/bulk-invalid-selection-cleanup
      - test/frontend-preferences-outlet
      - feat/native-cosmetics-preferences-v2
      - ux/live-cosmetics-selection-refresh
      - cleanup/remove-legacy-cosmetics-modal
      - docs/native-preferences-release-readiness
      - i18n/native-cosmetics-copy-cleanup
      - ux/native-responsive-cosmetics-admin
      - audit/final-release-readiness
      - fix/admin-stale-cosmetic-upload-repair

permissions:
  contents: read

jobs:
  discourse-ruby:
    runs-on: ubuntu-latest
    container: discourse/discourse_test:release
    timeout-minutes: 25
    env:
      RAILS_ENV: test
      LOAD_PLUGINS: 1
      PGUSER: discourse
      PGPASSWORD: discourse
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout pinned Discourse
        uses: actions/checkout@v4
        with:
          repository: discourse/discourse
          ref: 504fee3518fdbb10537eb1a92e54ff551dd66cc3
          path: discourse
          fetch-depth: 1

      - name: Checkout plugin branch
        uses: actions/checkout@v4
        with:
          path: discourse/plugins/discourse-user-cosmetics
          fetch-depth: 1

      - name: Prepare Discourse test environment
        working-directory: discourse
        run: |
          chown root:root .
          redis-server /etc/redis/redis.conf &
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE $PGUSER LOGIN SUPERUSER PASSWORD '$PGPASSWORD';" || true
          sudo -u postgres createdb -O "$PGUSER" discourse_test
          ln -s /var/www/discourse/vendor/bundle vendor/bundle
          bundle config set --local path vendor/bundle
          bundle config set --local deployment true
          bundle config set --local without development
          bundle install --jobs $(($(nproc) - 1))
          pnpm install --frozen-lockfile

      - name: Migrate test database with plugin
        working-directory: discourse
        run: bin/rake db:migrate

      - name: Load plugin Ruby
        working-directory: discourse
        run: bin/rails runner 'abort "plugin disabled" unless SiteSetting.discourse_user_cosmetics_enabled; puts "plugin ruby load OK"'

      - name: Run plugin specs directly
        working-directory: discourse
        run: bin/rspec plugins/discourse-user-cosmetics/spec

      - name: Run plugin specs via Discourse plugin task
        working-directory: discourse
        run: bin/rake 'plugin:spec[discourse-user-cosmetics]'

      - name: Run plugin QUnit
        working-directory: discourse
        run: bin/qunit --standalone --target discourse-user-cosmetics
